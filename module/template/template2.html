<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - 정주행 메인 허브</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        --bg-main: #07080e;
        --bg-card: #121422;
        --bg-card-hover: #191c30;
        --text-pure: #ffffff;
        --text-muted: #64748b;
        --accent: #45f3ff;
        --accent-gradient: linear-gradient(135deg, #45f3ff 0%, #ad45ff 100%);
        --border-color: rgba(255, 255, 255, 0.05);
      }

      /* [기능] 메인 홈 전용 5대 마스터 테마 스킨 정의 */
      body.theme-midnight {
        --bg-main: #000000;
        --bg-card: #111111;
        --bg-card-hover: #1f1f1f;
        --accent: #ffffff;
      }
      body.theme-purple {
        --bg-main: #0f0616;
        --bg-card: #200d2e;
        --bg-card-hover: #311447;
        --accent: #ff45f3;
      }
      body.theme-warm {
        --bg-main: #1a1612;
        --bg-card: #28221c;
        --bg-card-hover: #383027;
        --accent: #ffb045;
      }
      body.theme-green {
        --bg-main: #06120e;
        --bg-card: #0d241c;
        --bg-card-hover: #14352a;
        --accent: #45ffb0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Pretendard", sans-serif;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-pure);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 20px;
        transition: all 0.3s ease;
      }

      .main_hub_container {
        width: 100%;
        max-width: 780px;
        display: flex;
        flex-direction: column;
      }
      .list_header {
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
        position: relative;
      }
      .list_header h1 {
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 12px;
      }

      /* [신규 기능] 메인 제어 대시보드형 독립 설정 윈도우 */
      .main-settings-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 440px;
        background: #131622;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        z-index: 2005;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .modal-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
      }
      .modal-close-trigger {
        cursor: pointer;
        color: var(--text-muted);
        font-size: 0.8rem;
      }

      .modal-item-box {
        margin-bottom: 18px;
      }
      .modal-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 8px;
        display: block;
      }

      .theme-picker-flex {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .theme-btn-chip {
        padding: 10px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }
      .theme-btn-chip.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(255, 255, 255, 0.05);
      }

      /* 정주행 업적 수집 대시보드 */
      .badge-dashboard {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 15px 0;
        padding: 12px;
        background: rgba(255, 255, 255, 0.01);
        border-radius: 10px;
        border: 1px dashed var(--border-color);
      }
      .achieve-badge {
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 6px;
        background: #1b1e2e;
        color: var(--text-muted);
        font-weight: 600;
        opacity: 0.35;
        transition: all 0.3s;
      }
      .achieve-badge.unlocked {
        opacity: 1;
        color: var(--accent);
        background: rgba(69, 243, 255, 0.1);
        border: 1px solid rgba(69, 243, 255, 0.2);
      }

      .stats-container {
        margin: 15px 0;
      }
      .stats-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .stats-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        overflow: hidden;
      }
      .stats-fill {
        width: 0%;
        height: 100%;
        background: var(--accent-gradient);
        transition: width 0.4s ease;
      }

      /* 퀵패스 */
      .quickpass-banner {
        display: none;
        padding: 16px 20px;
        background: var(--accent-gradient);
        border-radius: 12px;
        margin-bottom: 20px;
        color: #000;
        text-decoration: none;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
      }
      .quickpass-title {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .quickpass-ep {
        font-size: 1.1rem;
      }

      .filter-tabs-board {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .filter-tab-btn {
        padding: 8px 14px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-tab-btn.active {
        background: #fff;
        color: #000;
        border-color: #fff;
      }

      /* 검색 및 조작 바 */
      .control-panel {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .search-input {
        flex: 1;
        padding: 12px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: #fff;
        font-size: 0.85rem;
        outline: none;
      }
      .backup-action-btn {
        padding: 0 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-pure);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
      }
      .master-settings-btn {
        padding: 0 16px;
        background: rgba(69, 243, 255, 0.08);
        border: 1px solid rgba(69, 243, 255, 0.2);
        border-radius: 8px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
      }

      .season-group-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
      }
      .season-tab {
        font-size: 0.9rem;
        color: var(--text-muted);
        cursor: pointer;
        padding-bottom: 6px;
        font-weight: 700;
        position: relative;
      }
      .season-tab.active {
        color: var(--accent);
      }
      .season-tab.active::after {
        content: "";
        position: absolute;
        bottom: -9px;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--accent);
      }

      /* 회차 리스트 */
      .list_container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .episode_item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        background-color: var(--bg-card);
        border-radius: 10px;
        text-decoration: none;
        color: var(--text-pure);
        font-weight: 600;
        font-size: 0.95rem;
        border: 1px solid var(--border-color);
        transition: all 0.2s;
      }
      .episode_item:hover {
        background-color: var(--bg-card-hover);
        border-color: rgba(69, 243, 255, 0.2);
      }

      .new-ep-badge {
        font-size: 0.65rem;
        color: #000;
        background: #ffea45;
        padding: 1px 5px;
        border-radius: 3px;
        font-weight: 800;
        margin-left: 6px;
        display: none;
      }
      .episode_item.is-new .new-ep-badge {
        display: inline-block;
      }

      .episode_item.state-read {
        opacity: 0.5;
      }
      .state-tag {
        font-size: 0.7rem;
        color: var(--accent);
        margin-left: 8px;
        font-weight: 700;
      }

      /* 가이드 팝업 */
      .cloud-guide-popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 440px;
        background: #16192b;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        z-index: 2000;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .cloud-guide-popup h3 {
        font-size: 1.1rem;
        margin-bottom: 10px;
      }
      .cloud-guide-popup p {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .cloud-textarea {
        width: 100%;
        height: 100px;
        background: #0b0c16;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: #fff;
        padding: 10px;
        font-size: 0.75rem;
        margin-bottom: 14px;
        resize: none;
        word-break: break-all;
      }
      .cloud-popup-btn-zone {
        display: flex;
        gap: 8px;
      }
      .cloud-close-btn {
        flex: 1;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: none;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .cloud-copy-btn {
        flex: 1;
        padding: 10px;
        background: var(--accent);
        color: #000;
        font-weight: 700;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="main_hub_container">
      <div class="list_header">
        <h1>{{title}}</h1>

        <div class="badge-dashboard">
          <div class="achieve-badge" id="badge-start">
            정주행의 서막 (첫입장)
          </div>
          <div class="achieve-badge" id="badge-half">
            중견 정독파 (50% 독파)
          </div>
          <div class="achieve-badge" id="badge-complete">
            완벽주의 마스터 (100% 완독)
          </div>
        </div>

        <div class="stats-container">
          <div class="stats-text">
            <span>나의 정독 스코어 지표</span
            ><span id="statsLabel">0% (0/0)</span>
          </div>
          <div class="stats-bg">
            <div class="stats-fill" id="statsFill"></div>
          </div>
        </div>
      </div>

      <!-- [신규 기능] 메인 전용 환경 제어 설정창 모달 -->
      <div class="main-settings-modal" id="mainSettingsModal">
        <div class="modal-title-bar">
          <strong>시스템 설정 창</strong>
          <span class="modal-close-trigger" onclick="toggleMainSettings(false)"
            >[닫기]</span
          >
        </div>
        <div class="modal-item-box">
          <span class="modal-label">메인 스킨 테마 선택</span>
          <div class="theme-picker-flex">
            <button
              class="theme-btn-chip"
              id="mt-neon"
              onclick="changeMainTheme('neon')"
            >
              네온 블루
            </button>
            <button
              class="theme-btn-chip"
              id="mt-midnight"
              onclick="changeMainTheme('midnight')"
            >
              미드나잇
            </button>
            <button
              class="theme-btn-chip"
              id="mt-purple"
              onclick="changeMainTheme('purple')"
            >
              사이버 퍼플
            </button>
            <button
              class="theme-btn-chip"
              id="mt-warm"
              onclick="changeMainTheme('warm')"
            >
              아늑한 웜톤
            </button>
            <button
              class="theme-btn-chip"
              id="mt-green"
              onclick="changeMainTheme('green')"
            >
              시력보호 그린
            </button>
          </div>
        </div>
      </div>

      <a href="#" class="quickpass-banner" id="quickpassBanner">
        <div>
          <div class="quickpass-title">
            마지막으로 읽던 화 이어서 정주행 퀵패스
          </div>
          <div class="quickpass-ep" id="quickpassEpName">제 1화</div>
        </div>
        <div>GO &rarr;</div>
      </a>

      <div class="filter-tabs-board">
        <button class="filter-tab-btn active" onclick="setReadFilter('all')">
          전체보기
        </button>
        <button class="filter-tab-btn" onclick="setReadFilter('unread')">
          안 본 회차
        </button>
        <button class="filter-tab-btn" onclick="setReadFilter('reading')">
          보던 중인 회차
        </button>
        <button class="filter-tab-btn" onclick="setReadFilter('read')">
          완독한 회차
        </button>
      </div>

      <div class="season-group-bar">
        <div class="season-tab active" onclick="setSeasonFilter('all')">
          전체 에피소드
        </div>
        <div class="season-tab" onclick="setSeasonFilter('season1')">
          시즌 1 (1화~50화)
        </div>
        <div class="season-tab" onclick="setSeasonFilter('season2')">
          시즌 2 (51화~)
        </div>
      </div>

      <!-- 검색 및 설정 진입 통합 제어 패널 -->
      <div class="control-panel">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          oninput="runMasterFilter()"
          placeholder="회차 제목 또는 숫자로 검색..."
        />
        <button class="backup-action-btn" onclick="openBackupPopup('export')">
          백업하기
        </button>
        <button class="backup-action-btn" onclick="openBackupPopup('import')">
          복구하기
        </button>
        <button class="master-settings-btn" onclick="toggleMainSettings(true)">
          SETTINGS
        </button>
      </div>

      <!-- 리스트 컨테이너 ( set count 으로 정상 문법 교정 완료) -->
      <div class="list_container" id="masterList">
        {% for path, name in item_lst -%}
        <a
          class="episode_item"
          href="{{path}}"
          data-name="{{name}}"
          data-index="{{loop.index}}"
        >
          <span class="item_title_box">
            <span class="txt_name">{{name}}</span>
            <span class="new-ep-badge">NEW</span>
            <span class="state-tag" id="tag-{{loop.index}}"></span>
          </span>
        </a>
        {% endfor -%}
      </div>
    </div>

    <div class="cloud-guide-popup" id="cloudPopup">
      <h3 id="popupTitle">데이터 백업 연동 시스템</h3>
      <p id="popupDesc">데이터 안전 보관을 위해 아래 코드를 관리하세요.</p>
      <textarea class="cloud-textarea" id="cloudCodeBox" readonly></textarea>
      <div class="cloud-popup-btn-zone">
        <button class="cloud-close-btn" onclick="closeBackupPopup()">
          닫기
        </button>
        <button
          class="cloud-copy-btn"
          id="popupActionBtn"
          onclick="runPopupAction()"
        >
          코드 복사
        </button>
      </div>
    </div>

    <script>
      const currentWebtoon = "{{title}}";
      let filterReadState = "all";
      let filterSeasonState = "all";
      let activePopupMode = "export";
      let deviceType = "PC";

      // 모달창 여닫기
      function toggleMainSettings(open) {
        document.getElementById("mainSettingsModal").style.display = open
          ? "block"
          : "none";
      }

      function checkDeviceType() {
        if (
          /mobile|iphone|ipad|ipod|android/.test(
            navigator.userAgent.toLowerCase()
          )
        ) {
          deviceType = "MOBILE";
        }
      }

      // 메인 통합 테마 스위칭 장치
      function changeMainTheme(theme) {
        document.body.className = "";
        if (theme !== "neon") document.body.classList.add("theme-" + theme);
        document
          .querySelectorAll(".theme-btn-chip")
          .forEach((d) => d.classList.remove("active"));
        document.getElementById("mt-" + theme).classList.add("active");
        localStorage.setItem("webtoon_mtheme_" + currentWebtoon, theme);
      }

      function runMasterFilter() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const items = document.querySelectorAll(".episode_item");
        const readData =
          JSON.parse(localStorage.getItem("webtoon_read_history")) || {};
        const readList = readData[currentWebtoon] || [];
        const positionData =
          JSON.parse(localStorage.getItem("webtoon_position_history")) || {};
        let readCount = 0;

        items.forEach((item) => {
          const name = item.getAttribute("data-name");
          const idx = parseInt(item.getAttribute("data-index"));
          const key = currentWebtoon + "_" + name;

          if (idx > items.length - 3) {
            item.classList.add("is-new");
          }
          let isRead = readList.includes(name);
          let isReading = positionData[key] && positionData[key] > 50;
          const tag = document.getElementById("tag-" + idx);
          item.classList.remove("state-read");

          if (isRead) {
            item.classList.add("state-read");
            tag.innerText = "완독";
            readCount++;
          } else if (isReading) {
            tag.innerText = "읽는 중";
          } else {
            tag.innerText = "";
          }

          let matchSearch = name.toLowerCase().includes(query);
          let matchRead =
            filterReadState === "all" ||
            (filterReadState === "read" && isRead) ||
            (filterReadState === "reading" && isReading && !isRead) ||
            (filterReadState === "unread" && !isRead && !isReading);
          let matchSeason =
            filterSeasonState === "all" ||
            (filterSeasonState === "season1" && idx <= 50) ||
            (filterSeasonState === "season2" && idx > 50);

          if (matchSearch && matchRead && matchSeason) {
            item.style.display = "flex";
          } else {
            item.style.display = "none";
          }
        });

        const total = items.length;
        const percent = total > 0 ? Math.round((readCount / total) * 100) : 0;
        document.getElementById("statsLabel").innerText =
          percent + "% (" + readCount + "/" + total + ")";
        document.getElementById("statsFill").style.width = percent + "%";

        if (total > 0)
          document.getElementById("badge-start").classList.add("unlocked");
        if (percent >= 50)
          document.getElementById("badge-half").classList.add("unlocked");
        if (percent === 100)
          document.getElementById("badge-complete").classList.add("unlocked");
      }

      function setupQuickPass() {
        const items = document.querySelectorAll(".episode_item");
        const positionData =
          JSON.parse(localStorage.getItem("webtoon_position_history")) || {};
        let lastTargetLink = null;
        let lastTargetName = null;

        for (let i = items.length - 1; i >= 0; i--) {
          const name = items[i].getAttribute("data-name");
          const key = currentWebtoon + "_" + name;
          if (positionData[key] && positionData[key] > 100) {
            lastTargetLink = items[i].getAttribute("href");
            lastTargetName = name;
            break;
          }
        }
        const banner = document.getElementById("quickpassBanner");
        if (lastTargetLink) {
          banner.style.display = "flex";
          banner.setAttribute("href", lastTargetLink);
          document.getElementById("quickpassEpName").innerText = lastTargetName;
        } else {
          banner.style.display = "none";
        }
      }

      function setReadFilter(mode) {
        filterReadState = mode;
        document
          .querySelectorAll(".filter-tab-btn")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
        runMasterFilter();
      }
      function setSeasonFilter(mode) {
        filterSeasonState = mode;
        document
          .querySelectorAll(".season-tab")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
        runMasterFilter();
      }

      function openBackupPopup(mode) {
        activePopupMode = mode;
        const popup = document.getElementById("cloudPopup");
        const title = document.getElementById("popupTitle");
        const desc = document.getElementById("popupDesc");
        const codeBox = document.getElementById("cloudCodeBox");
        const actionBtn = document.getElementById("popupActionBtn");
        popup.style.display = "block";

        if (mode === "export") {
          title.innerText = "데이터 안전 클라우드 백업";
          desc.innerText =
            deviceType === "MOBILE"
              ? "코드를 복사하여 스마트폰 메모장 등에 백업하세요."
              : "코드를 복사하여 텍스트 파일에 보관하세요.";
          const pkg = {
            read: localStorage.getItem("webtoon_read_history"),
            pos: localStorage.getItem("webtoon_position_history"),
            bmk: localStorage.getItem("webtoon_bookmarks"),
          };
          codeBox.value = btoa(encodeURIComponent(JSON.stringify(pkg)));
          codeBox.readOnly = true;
          actionBtn.innerText = "텍스트 코드 복사";
        } else {
          title.innerText = "데이터 복구 매니저";
          desc.innerText =
            "백업해 두었던 코드를 붙여넣기 한 뒤 복구 버튼을 클릭하세요.";
          codeBox.value = "";
          codeBox.readOnly = false;
          actionBtn.innerText = "복구 시스템 적용";
        }
      }

      function runPopupAction() {
        const codeBox = document.getElementById("cloudCodeBox");
        if (activePopupMode === "export") {
          codeBox.select();
          document.execCommand("copy");
          alert("코드가 복사되었습니다!");
          closeBackupPopup();
        } else {
          try {
            const rawStr = decodeURIComponent(atob(codeBox.value.trim()));
            const pkg = JSON.parse(rawStr);
            if (pkg.read)
              localStorage.setItem("webtoon_read_history", pkg.read);
            if (pkg.pos)
              localStorage.setItem("webtoon_position_history", pkg.pos);
            if (pkg.bmk) localStorage.setItem("webtoon_bookmarks", pkg.bmk);
            alert("정독 데이터 복구가 완료되었습니다!");
            window.location.reload();
          } catch (e) {
            alert("유효하지 않은 코드입니다.");
          }
        }
      }
      function closeBackupPopup() {
        document.getElementById("cloudPopup").style.display = "none";
      }

      window.onload = function () {
        checkDeviceType();
        const savedTheme =
          localStorage.getItem("webtoon_mtheme_" + currentWebtoon) || "neon";
        changeMainTheme(savedTheme);
        runMasterFilter();
        setupQuickPass();
      };
    </script>
  </body>
</html>
